<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Точка звука — музыка и сцена в Троицке и Калуге</title>
<meta name="description" content="Музыка, сцена и люди, с которыми хочется пробовать новое. Выбери свою Точку звука в Троицке или Калуге.">
<meta name="theme-color" content="#FFF5EA"><link rel="canonical" href="https://tzvuka.ru/">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preload" href="fonts/Architexture-v2.ttf" as="font" type="font/ttf" crossorigin>
<meta property="og:title" content="Точка звука — найди свой звук"><meta property="og:type" content="website"><meta property="og:url" content="https://tzvuka.ru/">
<meta property="og:description" content="Музыка, сцена и твой город. Троицк · Калуга.">

</head>
<body class="home-page">
{{logo}}
<div class="home-backdrop" aria-hidden="true">{{home_pattern}}</div>
<a class="skip-link" href="#main">К содержанию</a>
<header class="home-header">
  <a class="home-brand" href="./" aria-label="Точка звука — на главную"><svg viewBox="0 0 567 91" aria-hidden="true"><use href="#logo-full" width="567" height="91"/></svg></a>
  <nav class="header-cities" aria-label="Выбор филиала"><a href="troitsk/">Троицк</a><span aria-hidden="true">/</span><a href="kaluga/">Калуга</a></nav>
  <button class="header-cta openForm" type="button">Первое занятие <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4M7 4h9v9"/></svg></button>
</header>
<main id="main">
  <div class="home-gateway">
    <section class="intro-panel" aria-labelledby="home-title">
      <div class="intro-copy">
      <h1 id="home-title">Музыка начинается<br>с твоей <em>точки.</em></h1>
      </div>
    </section>
    <section class="city-choice" id="cities" aria-labelledby="city-choice-title">
      <div class="choice-heading"><h2 id="city-choice-title">Выбери свою точку</h2></div>
      <nav class="city-lines" aria-label="Выбор города">
        <a class="city-line" href="troitsk/"><span class="city-number" aria-hidden="true">01</span><div class="city-info"><h3>Троицк</h3><span class="city-overline">Москва · Новые Ватутинки</span><p>ул. 3-ая Нововатутинская, 2</p></div><span class="city-arrow" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 10h12M10 4l6 6-6 6"/></svg></span></a>
        <a class="city-line" href="kaluga/"><span class="city-number" aria-hidden="true">02</span><div class="city-info"><h3>Калуга</h3><span class="city-overline">Калужская область</span><p>ул. Ленина, 79</p></div><span class="city-arrow" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 10h12M10 4l6 6-6 6"/></svg></span></a>
      </nav>
    </section>
  </div>
</main>
{{footer}}
{{dialog}}
<script>
/* Same line travel, shape drift and turning knobs as the existing form artwork. */
(()=>{
  const svg=document.querySelector('.home-backdrop svg');
  if(!svg)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const F=[...svg.querySelectorAll('[data-f]')],D=[...svg.querySelectorAll('[data-d]')],N=[...svg.querySelectorAll('.nd')];
  const per=el=>8+((+el.dataset.t*1.37)%6);
  const wave=(el,s)=>Math.sin(s*2*Math.PI/per(el)+ +el.dataset.p);
  let id=0,t0=0,run=0,visible=true,timers=[];
  function knob(n){
    const r=(+n.dataset.r||0)+(Math.random()<.5?90:180)*(Math.random()<.35?-1:1);
    n.dataset.r=r;n.style.transform=`rotate(${r}deg)`;
    timers.push(setTimeout(()=>knob(n),2000+Math.random()*1000));
  }
  function frame(t){
    const k=svg.getScreenCTM()?.a||1,s=(t-t0)/1000;
    F.forEach(l=>{const a=32/k,w=wave(l,s),mode=l.dataset.f;
      const x=mode==='l'?-a*(1-w)/2:mode==='r'?a*(1-w)/2:a*w;
      l.style.transform=`translateX(${x.toFixed(2)}px)`;});
    D.forEach(d=>{const v=(16/k*wave(d,s)).toFixed(2),sc=(1+.05*Math.sin(s*2*Math.PI/(per(d)*1.3)+ +d.dataset.p*2)).toFixed(4);
      d.style.transform=(d.dataset.d==='x'?`translateX(${v}px)`:`translateY(${v}px)`)+` scale(${sc})`;});
    id=requestAnimationFrame(frame);
  }
  function sync(){
    if(!reduce.matches&&!document.hidden&&visible){
      if(id)return;t0=performance.now()-run;id=requestAnimationFrame(frame);
      N.forEach((n,i)=>timers.push(setTimeout(()=>knob(n),700+i*450)));
    }else{
      if(id){cancelAnimationFrame(id);id=0;run=performance.now()-t0;}
      timers.forEach(clearTimeout);timers=[];
      if(reduce.matches)[...F,...D,...N].forEach(el=>el.style.transform='');
    }
  }
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{visible=es[0].isIntersecting;sync();}).observe(svg);
  document.addEventListener('visibilitychange',sync);reduce.addEventListener('change',sync);sync();
})();
</script>
<script>if(location.hash==='#kaluga'||location.hash==='#troitsk')location.replace(location.hash.slice(1)+'/'+location.search);</script>
</body></html>
