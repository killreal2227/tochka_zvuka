<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Точка звука — музыка и сцена в Троицке и Калуге</title>
<meta name="description" content="Музыка, сцена и люди, с которыми хочется пробовать новое. Выбери свою Точку звука в Троицке или Калуге.">
<meta name="theme-color" content="#FFF5EA"><link rel="canonical" href="https://tzvuka.ru/">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preload" href="fonts/Architexture-v2.ttf" as="font" type="font/ttf" crossorigin>
<meta property="og:title" content="Точка звука — найди свой звук"><meta property="og:type" content="website"><meta property="og:url" content="https://tzvuka.ru/">
<meta property="og:description" content="Музыка, сцена и твой город. Троицк · Калуга.">
<link rel="stylesheet" href="experience.css"><script src="lead-form.js" defer></script>
<link rel="stylesheet" href="form.css">
<link rel="stylesheet" href="home.css"><script src="home-motion.js" defer></script>
<script src="button-labels.js" defer></script>
<script src="home-branches.js" defer></script>
</head>
<body class="home-page">
{{logo}}
<a class="skip-link" href="#main">К содержанию</a>
<header class="home-header">
  <a class="home-brand" href="./" aria-label="Точка звука — на главную"><svg viewBox="0 0 567 91" aria-hidden="true"><use href="#logo-full" width="567" height="91"/></svg></a>
  <div class="header-actions">
    <div class="home-branch" id="homeBranch">
      <button class="branch-btn" id="homeBranchButton" type="button" aria-expanded="false" aria-controls="homeBranchList"><span>Точки:</span><svg viewBox="0 0 16 10" aria-hidden="true"><path d="m2 2 6 6 6-6"/></svg></button>
      <nav class="home-branch-list" id="homeBranchList" aria-label="Выбор филиала" hidden>
        <a href="troitsk/"><span class="branch-dot" aria-hidden="true"></span><span><b>Троицк</b><small>3-я Нововатутинская, 2</small></span></a>
        <a href="kaluga/"><span class="branch-dot" aria-hidden="true"></span><span><b>Калуга</b><small>Ленина, 79</small></span></a>
      </nav>
    </div>
    <button class="header-cta openForm" type="button">ПЕРВОЕ ЗАНЯТИЕ <svg class="header-cta-icon" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19"/><path d="M20 12v16m-6-6 6 6 6-6"/></svg></button>
  </div>
</header>
<main id="main">
  <div class="page-pattern" aria-hidden="true">{{home_pattern}}</div>
  <div class="home-gateway">
    <section class="intro-panel" aria-labelledby="home-title">
      <div class="intro-copy">
      <h1 id="home-title">Музыка начинается<br>с твоей <em>точки.</em></h1>
      </div>
    </section>
    <section class="city-choice" id="cities" aria-labelledby="city-choice-title">
      <div class="choice-heading"><h2 id="city-choice-title">Выбирай свою:</h2></div>
      <nav class="city-lines" aria-label="Выбор города">
        <a class="city-line" href="troitsk/"><span class="city-number" aria-hidden="true">01</span><div class="city-info"><h3>Троицк</h3><span class="city-overline">Москва · Новые Ватутинки</span><p>ул. 3-ая Нововатутинская, 2</p></div><span class="city-arrow" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 10h12M10 4l6 6-6 6"/></svg></span></a>
        <a class="city-line" href="kaluga/"><span class="city-number" aria-hidden="true">02</span><div class="city-info"><h3>Калуга</h3><span class="city-overline">Калужская область</span><p>ул. Ленина, 79</p></div><span class="city-arrow" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 10h12M10 4l6 6-6 6"/></svg></span></a>
      </nav>
    </section>
  </div>
</main>
{{footer}}
{{dialog}}


<script>if(location.hash==='#kaluga'||location.hash==='#troitsk')location.replace(location.hash.slice(1)+'/'+location.search);</script>
</body></html>
