    <div class="sheet-body">
      <form id="leadForm">
        <h2 id="leadTitle" tabindex="-1">давай<br><em>знакомиться.</em></h2>
        <p class="sub" id="formIntro">Оставь номер – поможем выбрать направление</p>
        <div class="fields" id="contactFields">
          <label class="f" id="fName"><span class="sr">Как тебя зовут</span><input name="name" autocomplete="given-name" placeholder="Как тебя зовут" minlength="2" maxlength="80" required aria-describedby="nameError"><em class="err" id="nameError">Напиши имя: от 2 до 80 символов</em></label>
          <label class="f" id="fPhone"><span class="sr">Телефон</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" required aria-describedby="phoneError"><em class="err" id="phoneError">Проверь номер&nbsp;— нужно 11 цифр, начиная с 7 или 8</em></label>
        </div>
        <div class="lead-branch-label">
          <label id="leadBranchLabel" for="leadBranchNative">ТВОЯ ТОЧКА</label>
          <select id="leadBranchNative" name="branch" required><option value="">Выбери город</option><option value="troitsk">Троицк, 3-ая Нововатутинская, 2</option><option value="kaluga">Калуга, Ленина, 79</option></select>
          <div class="lead-branch-picker" hidden>
            <button id="leadBranchControl" class="lead-branch-control" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="leadBranchList" aria-labelledby="leadBranchLabel leadBranchValue" aria-required="true"><span id="leadBranchValue">Выбери город</span><span aria-hidden="true">⌄</span></button>
            <ul id="leadBranchList" class="lead-branch-list" role="listbox" aria-labelledby="leadBranchLabel" hidden></ul>
          </div>
        </div>
        <fieldset class="pick" id="chips" aria-describedby="pickCap">
          <legend class="direction-legend">Выбери направление:</legend>
          <div class="pick-row">
            <span class="pk" style="--c:var(--vocal)"><input type="radio" name="direction" aria-label="Вокал" id="d-vocal" value="vocal"><label for="d-vocal" data-ico="vocal"><span class="choice-icon" aria-hidden="true"><img src="{{root}}icons/ic_vocal.svg" alt="" aria-hidden="true"></span><span class="choice-name">Вокал</span></label></span>
            <span class="pk" style="--c:var(--guitar)"><input type="radio" name="direction" aria-label="Гитара" id="d-guitar" value="guitar"><label for="d-guitar" data-ico="guitar"><span class="choice-icon" aria-hidden="true"><img src="{{root}}icons/ic_guitar.svg" alt="" aria-hidden="true"></span><span class="choice-name">Гитара</span></label></span>
            <span class="pk" style="--c:var(--drums)"><input type="radio" name="direction" aria-label="Барабаны" id="d-drums" value="drums"><label for="d-drums" data-ico="drums"><span class="choice-icon" aria-hidden="true"><img src="{{root}}icons/ic_drums.svg" alt="" aria-hidden="true"></span><span class="choice-name">Барабаны</span></label></span>
            <span class="pk" style="--c:var(--piano)"><input type="radio" name="direction" aria-label="Фортепиано" id="d-piano" value="piano"><label for="d-piano" data-ico="piano"><span class="choice-icon" aria-hidden="true"><img src="{{root}}icons/ic_piano.svg" alt="" aria-hidden="true"></span><span class="choice-name">Фортепиано</span></label></span>
            <span class="pk actor-dual" style="--c:var(--orange);--c2:var(--blue)"><input type="radio" name="direction" aria-label="Актёрское мастерство" id="d-actor" value="actor"><label for="d-actor" data-ico="actor"><span class="choice-icon" aria-hidden="true"><img src="{{root}}icons/ic_actor.svg" alt="" aria-hidden="true"></span><span class="choice-name">Актёрское мастерство</span></label></span>
            <span class="pk" style="--c:var(--pink)"><input type="radio" name="direction" aria-label="Ораторское искусство" id="d-speech" value="speech"><label for="d-speech" data-ico="speech"><span class="choice-icon" aria-hidden="true"><img src="{{root}}icons/ic_speech.svg" alt="" aria-hidden="true"></span><span class="choice-name">Ораторское искусство</span></label></span>
          </div>
          <p class="pick-cap" id="pickCap" aria-live="polite"></p>
        </fieldset>
        <label class="lead-honeypot" aria-hidden="true" inert>Ваш сайт<input name="website" tabindex="-1" autocomplete="off"></label>
        <p class="form-status" id="leadStatus" role="status" aria-live="polite"></p>
        <div class="send">
          <div class="action-pane">
            <button class="btn lead-submit" type="submit" id="submitBtn">Отправить заявку<i><svg><use href="#i-arrow"/></svg></i></button>
            <p class="lead-consent"><a class="lead-reassurance" href="{{root}}documents/" data-consent-url="{{root}}documents/#consent" data-policy-url="{{root}}documents/#privacy" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><span>Ваши данные в безопасности</span></a></p>
          </div>
          <div class="action-pane">
            <a class="btn lead-call" href="tel:+79957907670" aria-label="Позвонить по номеру +7 995 790-76-70">Позвонить<i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3 4 5c-2 3 2 9 6 13s8 4 10 1l1-3-5-3-2 2c-2-1-4-3-5-5l2-2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></i></a>
            <p class="where lead-address"><a id="leadBranchCaption" target="_blank" rel="noopener" title="Открыть адрес на карте">Выбери город</a></p>
          </div>
        </div>
      </form>
      <div class="done lead-success" id="done" hidden>
        <div class="rings"><i></i><b></b></div>
        <h2 id="doneText" role="status" aria-live="polite">Спасибо, заявка отправлена</h2>
        <button class="btn" type="button" id="doneClose" data-lead-dismiss>Закрыть<i><svg><use href="#i-x"/></svg></i></button>
      </div>
    </div>
  </div>
</div>
