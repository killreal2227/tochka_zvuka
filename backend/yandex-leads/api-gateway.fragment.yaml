# REVIEW ONLY: merge into the EXISTING gateway after its purpose is audited.
# Do not replace its full specification. Do not attach a used learning function.
paths:
  /public/lead:
    post:
      operationId: websiteLead
      responses:
        '200':
          description: Persisted in YDB; Telegram delivery may still be queued
        '400':
          description: Invalid request
        '403':
          description: Origin or SmartCaptcha rejected
        '409':
          description: requestId reused with different data
        '429':
          description: Rate limited
        '503':
          description: Disabled or unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_AFTER_RESOURCE_AUDIT
        service_account_id: REPLACE_WITH_APPROVED_INVOKER_SA
        tag: leads-candidate
        payload_format_version: '0.1'
        context:
          route: website-leads-v1
    options:
      operationId: websiteLeadPreflight
      responses:
        '204':
          description: Approved origin and headers
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: REPLACE_AFTER_RESOURCE_AUDIT
        service_account_id: REPLACE_WITH_APPROVED_INVOKER_SA
        tag: leads-candidate
        payload_format_version: '0.1'
        context:
          route: website-leads-v1
