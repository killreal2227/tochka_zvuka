# Публикует папку site/ на GitHub Pages.
# Включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'templates/**', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static city pages
        run: python3 scripts/build_site.py
      - name: Check pages and links
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
