# Публикует папку site/ на GitHub Pages.
# Включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'templates/**', 'scripts/**', 'backend/**', 'site-config.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Yandex lead candidate
        run: |
          pip install -r backend/yandex-leads/requirements-admin.txt
          python -m unittest discover -s backend/yandex-leads/tests -v
      - name: Build static city pages
        run: python3 scripts/build_site.py
      - name: Check pages and links
        run: python3 scripts/check_site.py
      - name: Check Telegram lead handler
        run: node --test scripts/home-regression.test.mjs scripts/city-interactions.test.mjs backend/leads.test.mjs routing/legal-redirects.test.mjs scripts/scroll-reveal.test.mjs scripts/lead-viewport.test.mjs scripts/lead-client.test.mjs scripts/branch-picker.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for uploaded Pages artifact metadata
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
